{% extends "layout.html" %}

{% block title %}Edit post{% endblock %}

{% block content %}
    <h1>Edit post</h1>

    <form action="/edit/{{ meetup.id }}" method="POST">
    <p>
        <label for="title">Title</label>: <br />
        <input type="text" id="title" name="title" value="{{ meetup.title }}" maxlength="100" required />
    </p>
    <p>
        <label for="classlang">Language</label>: <br />
        <select name="classes" id="classlang" required>
            <option value="">(choose)</option>
        {% for option in all_classes['Language'] %}
            {% if option == classes['Language'] %}
                <option value="Language:{{ option }}" selected>{{ option }}</option>
            {% else %}
                <option value="Language:{{ option }}">{{ option }}</option>
            {% endif %}
        {% endfor %}
        </select>
    </p>
    <p>
        <label for="classlevel">Suitable level</label>: <br />
        <select name="classes" id="classlevel">
            <option value="">(choose)</option>
        {% for option in all_classes['Level'] %}
            {% if option == classes['Level'] %}
                <option value="Level:{{ option }}" selected>{{ option }}</option>
            {% else %}
                <option value="Level:{{ option }}">{{ option }}</option>
            {% endif %}
        {% endfor %}
        </select>
    </p>
    <p>
        <label for="date_time">Date and time</label>: <br />
        <input type="datetime-local" id="date_time" name="date_time" value = "{{ meetup.date_time }}" required /> 
    </p>
    <p>
        <label for="venue">Venue</label>: <br />
        <input type="text" id="venue" name="venue" value = "{{ meetup.venue }}" maxlength="100" required/>
    </p>
    <p>
        <label for="classcity">City</label>: <br />
        <select name="classes" id="classcity" required>
            <option value="">(choose)</option>
        {% for option in all_classes['City'] %}
            {% if option == classes['City'] %}
                <option value="City:{{ option }}" selected>{{ option }}</option>
            {% else %}
                <option value="City:{{ option }}">{{ option }}</option>
            {% endif %}
        {% endfor %}
        </select>
    </p>
    <p>
        <label for="avail_slot">Target participant amount</label>: <br />
        <input type="number" id="avail_slot" name="avail_slot" min="{{ [5, meetup.participant_number] | max }}" max="50" value = "{{ meetup.avail_slot }}" />
    </p>
    <p>
        <label for="content">Post content</label>: <br />
        <textarea id="content" name="content" rows="5" cols="40" maxlength = "5000">{{ meetup.content }}</textarea>
    </p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" value="Confirm edit" />
    <p><a href="/">Cancel edit and back to front page</a></p>
    </form>
{% endblock %}

<!DOCTYPE html>
<html>

<head>
  <title>Create new post</title>
</head>

<body>
    <h1>Create new post</h1>

    <form action="/new_post" method="POST">
    <p>
        Title: <br />
        <input type="text" name="title" maxlength="100" required />
    </p>
    <p>
        <label for="classlang">Language</label>: <br />
        <select name="clases" id="classlang">
            <option value="">(choose)</option>
        {% for option in classes['language'] %}
            <option value="language:{{ option }}">{{ option }}</option>
        {% endfor %}
        </select>
    </p>
    <p>
        Date and time: <br />
        <input type="datetime-local" name="date_time" required /> 
    </p>
    <p>
        Venue: <br />
        <input type="text" name="venue" maxlength="100" required />
    </p>
    <p>
        <label for="classcity">City</label>: <br />
        <select name="clases" id="classcity" required>
            <option value="">(choose)</option>
        {% for option in classes['city'] %}
            <option value="city:{{ option }}">{{ option }}</option>
        {% endfor %}
        </select>
    </p>
    <p>
        Target participant amount: <br />
        <input type="number" name="avail_slot" min="5" max="50" />
    </p>
    <p>
        Post content: <br />
        <textarea name="content" rows="5" cols="40" maxlength="5000"></textarea>
    </p>
    <input type="submit" value="Create post" />
    </form>

</body>

</html>

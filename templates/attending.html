{% extends "layout.html" %}

{% block title %}Attending speaking meetup{% endblock %}

{% block content %}
    <h1>Attending {{ meetup.title }}</h1>
    
    <form action="/attending/{{ meetup.id }}" method="POST">
    <p>
        <label for="name">Your name</label>: <br />
        <input type = "text" id="name" name="name" maxlength="100" required />
    </p>
    <p>
        How do you define you {{ meetup.language }} level? <br />
        <input type="radio" id="begin" name="level" value="Beginner">
        <label for="begin">Beginner</label><br />
        <input type="radio" id="inter" name="level" value="Intermediate">
        <label for="inter">Intermediate</label><br />
        <input type="radio" id="advanced" name="level" value="Advanced">
        <label for="advanced">Advacned</label><br />
        <input type="radio" id="native" name="level" value="Native">
        <label for="native">Native</label><br />
    </p>
    <p>
        <label for="comment">Write here any comment/question/need for special accommodation</label> <br />
        <textarea id="comment" name="comment" rows="5" cols="40" maxlength="5000"></textarea>
    </p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" value="Submit" />
    </form>
    <p><a href="/">Cancel registration and back to front page</a></p>
{% endblock %}

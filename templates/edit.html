<!DOCTYPE html>
<html>

<head>
  <title>Edit post</title>
</head>

<body>
    <h1>Create new post</h1>

    <form action="/edit/{{ meetup.id }}" method="POST">
    <p>
        Title: <br />
        <input type="text" name="title" value="{{ meetup.title }}" maxlength="100" />
    </p>
    <p>
        Language: <br />
        <input type="text" name="languages" value = "{{ meetup.languages }}" maxlength="50" />
    </p>
    <p>
        Date and time: <br />
        <input type="datetime-local" name="date_time" value = "{{ meetup.date_time }}" /> 
    </p>
    <p>
        Location: <br />
        <input type="text" name="venue" value = "{{ meetup.venue }}" maxlength="100"/>
    </p>
    <p>
        Target participant amount: <br />
        <input type="number" name="avail_slot" min="5" max="50" value = "{{ meetup.avail_slot }}" />
    </p>
    <p>
        Post content: <br />
        <textarea name="content" rows="5" cols="40" maxlength = "5000">{{ meetup.content }}</textarea>
    </p>
    <input type="submit" value="Confirm edit" />
    </form>

</body>

</html>

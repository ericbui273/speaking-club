<!DOCTYPE html>
<html>

<head>
  <title>Remove post</title>
</head>

<body>
  <h1>Remove post</h1>

  <form action="/remove/{{ post.id }}" method="POST">
    <p>
      Are you sure you want to remove this post?
    </p>
    <input type="submit" name="continue" value="Yes" />
    <input type="submit" name="cancel" value="No" />
  </form>
</body>

</html>

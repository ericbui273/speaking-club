{% extends "layout.html" %}

{% block title %}Create new account{% endblock %}

{% block content %}
  <h1>Create new account</h1>
  <form action="/register" method="post">
      <label for="username">Username</label>: <br />
      <input type="text" id="username" name="username" value="{{ filled.username }}" required minlength="2" maxlength="50" />
    </p>
        <p class ="help-text">
      Username should contain at least 2 and at most 50 characters.
    </p>
    <p>
      <label for="password1">Password</label>: <br />
      <input type="password" id="password1" name="password1" minlength="8" required />
    </p>
    <p class ="help-text">
      Password should contain at least 8 characters.
    </p>
    <p>
      <label for="password2">Confirm password</label>: <br />
      <input type="password" name="password2" required />
    </p>
    <input type="submit" value="Create account" />
  </form>

  <hr />
  <p>
    <a href="/">To the frontpage</a>
  </p>
{% endblock %}

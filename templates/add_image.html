{% extends "layout.html" %}

{% block title %}Add profile picture{% endblock %}

{% block content %}
        <h1>Add profile picture</h1>
        <p><a href="/">Back to front page</a></p>
        <p>Upload a .jpg image no larger than 100 KB.</p>
        <form action="/add_image" method="POST" enctype="multipart/form-data">
            <p>
                <label for="image">Image: </label>
                <input type="file" id="image" name="image" accept=".jpg" />
            </p>
            <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
            <input type="submit" value="Lähetä" />
        </form>
{% endblock %}

<!DOCTYPE html>
<html>

<head>
  <title>Create account</title>
</head>

<body>
  <form action="/register" method="post">
    <p>
      Username: <br />
      <input type="text" name="username" required minlength="5" maxlength="50" />
    </p>
        <p class ="help-text">
      Username should contain at least 5 and at most 50 characters.
    </p>
    <p>
      Password: <br />
      <input type="password" name="password1" minlength="8" required />
    </p>
    <p class ="help-text">
      Password should contain at least 8 characters.
    </p>
    <p>
      Confirm password: <br />
      <input type="password" name="password2" required />
    </p>
    <input type="submit" value="Create account" />
  </form>

  <hr />
  <p>
    <a href="/">To the frontpage</a>
  </p>
</body>

</html>
